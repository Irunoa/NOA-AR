<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NOA AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

   #xButton {
  position: fixed;
  bottom: 40px;
  left: calc(50% - 45px);

  width: 70px;
  height: 70px;

  border: none;
  background: transparent;

  display: none;

  z-index: 9999;
}

#vrcButton {
  position: fixed;
  bottom: 40px;
  left: calc(50% + 45px);

  width: 70px;
  height: 70px;

  border: none;
  background: transparent;

  display: none;

  z-index: 9999;
}

#xButton img,
#vrcButton img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
  </style>
</head>

<body>

  <button id="xButton" type="button" aria-label="Open X profile">
    <img src="./assets/x-icon.png" alt="X">
  </button>
  <button id="vrcButton" type="button" aria-label="Open VRChat profile">
    <img src="./assets/vrc-icon.png" alt="VRChat">
  </button>
  
  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="noaVideo"
        src="./assets/名刺動画.mp4"
        muted
        playsinline
        webkit-playsinline>
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-video
        src="#noaVideo"
        position="0 0 0"
        width="1.65"
        height="1"
        rotation="0 0 0">
      </a-video>
    </a-entity>

  </a-scene>

  <script>
    const video = document.querySelector("#noaVideo");
    const target = document.querySelector("[mindar-image-target]");
    const xButton = document.querySelector("#xButton");
    const vrcButton = document.querySelector("#vrcButton");

let showButtonTimer = null;
let isTargetVisible = false;

target.addEventListener("targetFound", () => {
  isTargetVisible = true;

  xButton.style.display = "none";
  vrcButton.style.display = "none";

  if (showButtonTimer) {
    clearTimeout(showButtonTimer);
  }

  video.pause();
  video.currentTime = 0;
  video.play();

  showButtonTimer = setTimeout(() => {
    if (isTargetVisible) {
      xButton.style.display = "block";
      vrcButton.style.display = "block";
    }
  }, 15000);
});

target.addEventListener("targetLost", () => {
  isTargetVisible = false;

  video.pause();
  video.currentTime = 0;
  xButton.style.display = "none";
  vrcButton.style.display = "none";

  if (showButtonTimer) {
    clearTimeout(showButtonTimer);
  }
});

xButton.addEventListener("click", () => {
  location.href = "https://x.com/irunoa_vrc";
});

vrcButton.addEventListener("click", () => {
  location.href =
    "https://vrchat.com/home/user/usr_0d379726-4fbc-45f0-a41a-84ce8537e66f";
});
  </script>

</body>
</html>
